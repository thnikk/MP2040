<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- ScreenPad: Waveshare RP2350-Touch-LCD-3.5 (3.5" 320x480 touch panel).
     Case outline matches the with-case dimensions (63.67 x 95.11 mm) and the
     active display area (48.96 x 73.44 mm), so the top/bottom bezel is 10.835 mm
     and the side bezel is 7.355 mm, as on the real unit. -->
<svg
   width="63.67mm"
   height="95.11mm"
   viewBox="0 0 63.67 95.11"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">

  <rect
     id="case"
     inkscape:label="case"
     x="0"
     y="0"
     width="63.67"
     height="95.11"
     rx="7.3"
     ry="7.3"
     fill="#000000" />

  <!-- Screen bezel: plain black front, thicker top/bottom than sides. -->
  <rect
     id="screen-bezel"
     inkscape:label="ignore"
     x="0"
     y="0"
     width="63.67"
     height="95.11"
     rx="7.3"
     ry="7.3"
     fill="#000000" />

  <!-- Active screen area inside the bezel (48.96 x 73.44 mm). -->
  <rect
     id="screen-bg"
     inkscape:label="ignore"
     x="7.355"
     y="10.835"
     width="48.96"
     height="73.44"
     fill="#1c1f26" />

  <!-- LED slots (the on-screen buttons). Authored before the key shapes so the
       key outlines and labels draw on top; a color-keypad board lets the LED
       fill show through. Indices are row-major, matching the 4x3 touch grid. -->
  <g inkscape:label="leds" fill="#2b303b">
    <rect id="led0"  x="8.301"  y="11.394" width="14.799" height="15.997" rx="1.447" />
    <rect id="led1"  x="24.620" y="11.394" width="14.799" height="15.997" rx="1.447" />
    <rect id="led2"  x="40.940" y="11.394" width="14.799" height="15.997" rx="1.447" />
    <rect id="led3"  x="8.301"  y="28.929" width="14.799" height="15.997" rx="1.447" />
    <rect id="led4"  x="24.620" y="28.929" width="14.799" height="15.997" rx="1.447" />
    <rect id="led5"  x="40.940" y="28.929" width="14.799" height="15.997" rx="1.447" />
    <rect id="led6"  x="8.301"  y="46.464" width="14.799" height="15.997" rx="1.447" />
    <rect id="led7"  x="24.620" y="46.464" width="14.799" height="15.997" rx="1.447" />
    <rect id="led8"  x="40.940" y="46.464" width="14.799" height="15.997" rx="1.447" />
    <rect id="led9"  x="8.301"  y="63.999" width="14.799" height="15.997" rx="1.447" />
    <rect id="led10" x="24.620" y="63.999" width="14.799" height="15.997" rx="1.447" />
    <rect id="led11" x="40.940" y="63.999" width="14.799" height="15.997" rx="1.447" />
  </g>

  <!-- Key hit areas / label anchors (linear matrix key index). -->
  <g inkscape:label="buttons" fill="none">
    <rect id="key0"  x="8.301"  y="11.394" width="14.799" height="15.997" rx="1.447" />
    <rect id="key1"  x="24.620" y="11.394" width="14.799" height="15.997" rx="1.447" />
    <rect id="key2"  x="40.940" y="11.394" width="14.799" height="15.997" rx="1.447" />
    <rect id="key3"  x="8.301"  y="28.929" width="14.799" height="15.997" rx="1.447" />
    <rect id="key4"  x="24.620" y="28.929" width="14.799" height="15.997" rx="1.447" />
    <rect id="key5"  x="40.940" y="28.929" width="14.799" height="15.997" rx="1.447" />
    <rect id="key6"  x="8.301"  y="46.464" width="14.799" height="15.997" rx="1.447" />
    <rect id="key7"  x="24.620" y="46.464" width="14.799" height="15.997" rx="1.447" />
    <rect id="key8"  x="40.940" y="46.464" width="14.799" height="15.997" rx="1.447" />
    <rect id="key9"  x="8.301"  y="63.999" width="14.799" height="15.997" rx="1.447" />
    <rect id="key10" x="24.620" y="63.999" width="14.799" height="15.997" rx="1.447" />
    <rect id="key11" x="40.940" y="63.999" width="14.799" height="15.997" rx="1.447" />
  </g>

  <!-- Status/footer strip at the bottom of the panel. -->
  <rect
     id="screen-footer"
     inkscape:label="ignore"
     x="7.355"
     y="80.584"
     width="48.96"
     height="3.692"
     rx="0.559"
     fill="#1c1f26" />
</svg>
