syntax = "proto2";

import "nanopb.proto";
import "enums.proto";

message KeyMapping
{
    repeated uint32 keycodes = 1 [(nanopb).max_count = 128];
    repeated uint32 modifierMasks = 2 [(nanopb).max_count = 128];
    // Per-pin MIDI note numbers (0-127). 0 = no note (pin silent in MIDI
    // mode). Only consulted when the default input mode is MIDI.
    repeated uint32 midiNotes = 3 [(nanopb).max_count = 128];
    // Per-pin note-on velocity (1-127). 0 = use the global MIDI velocity
    // (a per-note accent).
    repeated uint32 midiVelocities = 4 [(nanopb).max_count = 128];
    // Per-key LED colors for custom mode (LED_MODE_CUSTOM). Indexed by key
    // like the other per-key arrays. A value of 0 (or no entry, count <
    // MAX_KEYS) uses Custom mode's colorNormalByMode[0] / colorPressedByMode[0].
    repeated uint32 ledNormalColors = 5 [(nanopb).max_count = 128];
    repeated uint32 ledPressedColors = 6 [(nanopb).max_count = 128];
}

// Gamepad control mapping for the gamepad input modes (XInput / Switch Pro).
// Stored separately from the keyboard KeyMapping so a pin can carry a keyboard
// key, a MIDI note, AND gamepad controls independently (each mode uses what it
// needs). Global (not per-profile), like the other gamepad options.
message GamepadMapping
{
    // Per-pin gamepad control mask. Bit 0 = dpad up, 1 = down, 2 = left,
    // 3 = right; buttons B1-A2 in bits 4-17 (see GAMEPAD_PIN_MASK_* in
    // gamepadmapping.h). Several controls on one pin are OR'd so a single key
    // can press multiple gamepad inputs at once. 0 = unmapped.
    repeated uint32 masks = 1 [(nanopb).max_count = 128];
}

// Touch ring behavior. The ring (a circular 4-pad capacitive control) is one
// virtual input interpreted per input mode:
//   - gamepad:      ring position -> the selected analog stick.
//   - keyboard:     ring rotation -> scroll or volume.
//   - MIDI:         ring position -> pitch bend.
message RingOptions
{
    // Gamepad mode: which analog stick the ring drives (0 = left, 1 = right).
    optional uint32 ringStickTarget = 1;
    // Keyboard mode: 0 = off, 1 = scroll, 2 = volume. Defaults to volume.
    optional uint32 ringKeyboardMode = 2;
    // Keyboard scroll mode axis: 0 = vertical, 1 = horizontal.
    optional uint32 ringScrollAxis = 3;
    // MIDI mode: 0 = off, 1 = pitch bend. Defaults to pitch bend.
    optional uint32 ringMidiBehavior = 4;
}

// Global MIDI output options, used when the default input mode is MIDI.
message MIDIOptions
{
    // MIDI channel for all note messages (0-15).
    optional uint32 channel = 1;
    // Note-on velocity (1-127).
    optional uint32 velocity = 2;
}

// A single macro step: hold `keycode` (with `modifiers`) for `holdMs`, then
// release for `delayMs` before the next step. A step with keycode 0 is a pure
// delay. Times are clamped to 0-5000ms at load and via the web config.
message MacroStep
{
    optional uint32 keycode = 1;
    optional uint32 modifiers = 2;
    optional uint32 holdMs = 3;
    optional uint32 delayMs = 4;
}

// A macro: an ordered key sequence played while its trigger key is held,
// looping from the last step back to the first. Definitions are global
// (shared across profiles); per-key triggers live in Config.macroIndices.
message Macro
{
    repeated MacroStep steps = 1 [(nanopb).max_count = 32];
}

// A configurable hotkey: a set of key indices held simultaneously that fires
// a single action. Combos are matched in Config.hotkeys order (first match
// wins, so slot 0 has the highest priority). When a hotkey fires, its trigger
// keys are suppressed from the active input driver so they don't also emit
// their normal key / MIDI note / gamepad control.
message HotkeyEntry
{
    // Key indices (pins, or linear matrix indices) that must all be held.
    repeated uint32 keys = 1 [(nanopb).max_count = 8];
    // Action to trigger (see HotkeyAction in enums.proto). 0 = disabled.
    optional HotkeyAction action = 2;
}

message LEDOptions
{
    optional int32 dataPin = 1;
    optional LEDFormat_Proto ledFormat = 2;
    optional uint32 ledsPerKey = 3;
    // Legacy single max brightness. Superseded by brightnessByMode; kept so
    // older configs keep their brightness when first upgraded (all modes are
    // seeded from it).
    optional uint32 brightnessMaximum = 4;
    // Legacy single normal/pressed colors. Superseded by colorNormalByMode /
    // colorPressedByMode; kept so older configs keep their colors when first
    // upgraded (all modes are seeded from them).
    optional uint32 colorNormal = 6;
    optional uint32 colorPressed = 7;
    // Total number of LEDs in the strip. 0 = derive from pinLedIndices.
    optional uint32 ledCount = 8;
    // Per-pin LED strip index (index in array = pin, value = LED index).
    // -1 = pin has no LED.
    repeated int32 pinLedIndices = 9 [(nanopb).max_count = 128];
    // LED theme mode (0=custom, 1=cycle, 2=reactive, 3=bps, 4=ripple,
    // 5=rain, 6=fire). Default from the board's LED_MODE define; editable via
    // the web config.
    optional uint32 ledMode = 10;
    // Legacy single animation speed (0-100 percent). Superseded by ledSpeeds;
    // kept so older configs keep their speed when first upgraded (all modes
    // are seeded from it).
    optional uint32 ledSpeed = 11;
    // Inactivity timeout in seconds: LEDs turn off after this long with no key
    // held (any press wakes them). 0 = always on. Clamped to 0-600 at runtime.
    optional uint32 ledTimeout = 12;
    // Per-mode animation speed (0-100 percent, higher = faster), indexed by
    // LedMode. Each effect maps its own percent into a theme step interval.
    // Empty on old configs; seeded from ledSpeed at load.
    repeated uint32 ledSpeeds = 13 [(nanopb).max_count = 7];
    // Per-mode normal/pressed colors, indexed by LedMode. Only modes that
    // render them use them (Custom fallback, Ripple, Rain, Fire). Empty on
    // old configs; seeded from colorNormal / colorPressed at load.
    repeated uint32 colorNormalByMode = 14 [(nanopb).max_count = 7];
    repeated uint32 colorPressedByMode = 15 [(nanopb).max_count = 7];
    // Per-mode brightness (0-255), indexed by LedMode. Empty on old configs;
    // seeded from brightnessMaximum at load.
    repeated uint32 brightnessByMode = 16 [(nanopb).max_count = 7];
    // Mode indicator LED (board-fixed pin showing the active input mode):
    // 0 = off, 1 = on. Defaults to on when absent.
    optional uint32 statusLedEnabled = 17;
}

// A profile: a full key mapping plus the per-profile MIDI options and LED
// theme scalars. profiles[0] is the base; profiles[1-3] are alternates. The
// active profile is copied into the top-level keyMapping / midiOptions /
// ledOptions at boot (the top-level fields act as the working copy that the
// drivers read). Speed, brightness and the normal/pressed colors are global
// (per-mode in LEDOptions), not per-profile.
message Profile
{
    optional KeyMapping keyMapping = 1;
    optional MIDIOptions midiOptions = 2;
    optional uint32 ledMode = 3;
}

message Config
{
    optional KeyMapping keyMapping = 1;
    optional LEDOptions ledOptions = 2;
    optional int32 webConfigPin = 3;
    // Input mode used at boot when no boot-mode pin is held. INPUT_MODE_CONFIG
    // is treated as KEYBOARD (config mode is only ever entered via the web
    // config pin). Defaults to keyboard for existing configs.
    optional InputMode defaultInputMode = 4;
    optional MIDIOptions midiOptions = 5;
    // All four profiles (index 0 = base). The active profile is copied into the
    // top-level keyMapping/midiOptions/ledOptions at boot.
    repeated Profile profiles = 6 [(nanopb).max_count = 4];
    // Boot-time profile selection (0-3, index into profiles).
    optional uint32 activeProfile = 7;
    // Global macro definitions (M1-M8). Per-key triggers reference these by
    // 1-based index (Config.macroIndices). Stored in Config (not a profile)
    // so all profiles share the same macro set.
    repeated Macro macros = 8 [(nanopb).max_count = 8];
    // Per-key macro trigger assignment (1-8 = macro M1-M8, 0 = no macro). When
    // set, the pin plays the macro (loop-while-held) instead of its keycode /
    // modifier mask. Global like the macro definitions themselves.
    repeated uint32 macroIndices = 9 [(nanopb).max_count = 128];
    // Key debounce interval in ms (0 = apply raw state immediately). Global.
    optional uint32 debounceInterval = 10;
    // Touch pad auto-calibration, indexed by GPIO pin (only auto-calibrated
    // pads are populated; 0 = no stored entry). Saved at every normal boot
    // (pads idle) and loaded instead of re-sampling on a web config reboot,
    // where the pad that triggered the reboot is still being held. This stores
    // the raw idle baseline; the press/release thresholds are derived from it
    // each boot with touchMargin / touchRelease, so tuning those two values
    // applies without re-sampling.
    repeated uint32 touchBaselines = 11 [(nanopb).max_count = 30];
    // Percent over the idle baseline that counts as a touch (press threshold).
    optional uint32 touchMargin = 12;
    // Percent of the press threshold that must be shed before a touch
    // releases. The release threshold is derived as
    // thresholdOn * (1 - touchRelease/100), so higher = a wider anti-chatter
    // dead-band (less chatter) and lower = a snappier release. Unlike a second
    // offset from baseline, this can never put the release above the press
    // threshold.
    optional uint32 touchRelease = 13;
    // Enable a USB serial (CDC) command interface alongside the keyboard. The
    // device re-enumerates with an extra serial port on the next boot; from a
    // terminal you can issue commands (type "help") to control the board live,
    // e.g. switch profiles. Off by default.
    optional bool serialConfigEnabled = 14;
    // Gamepad options, only consulted when the default input mode is a gamepad
    // mode (XInput / Switch Pro). Global like defaultInputMode.
    // SOCD cleaning mode for the dpad (see SOCDMode in enums.proto).
    optional SOCDMode socdMode = 15;
    // Use the Nintendo face-button layout on Switch Pro (B1->A, B2->B, B3->Y,
    // B4->X). Off = Xbox layout (B1->B, B2->A, B3->Y, B4->X). XInput always
    // uses the Xbox layout.
    optional bool useNintendoLayout = 16;
    // Per-pin gamepad control mapping (independent of the keyboard / MIDI
    // key mapping, see GamepadMapping).
    optional GamepadMapping gamepadMapping = 17;
    // Touch ring per-mode behavior (see RingOptions).
    optional RingOptions ringOptions = 18;
    // On-screen display options (SSD1306/SH1106 over I2C). Physical wiring
    // (I2C block/pins) is a board property seeded from BoardConfig.h; the rest
    // is user config editable via the web config / on-device mini menu.
    optional DisplayOptions displayOptions = 19;
    // Configurable hotkeys (see HotkeyEntry): simultaneous key combos that
    // trigger an action (SOCD mode, profile switch, macro playback). Global
    // (not per-profile), like macros. Up to 16, matched in order.
    repeated HotkeyEntry hotkeys = 20 [(nanopb).max_count = 16];
}

// On-screen display configuration. See DisplayController for how it's used.
// Single full-panel layout (no GP2040-CE left/right split).
message DisplayOptions
{
    // Master enable. Board-fixed: re-applied from the board config (the display
    // runs whenever the board ships one), not editable via the web config.
    optional bool enabled = 1;
    // I2C block (0 = i2c0, 1 = i2c1) and pins. Board properties, re-applied
    // from the board config at load.
    optional uint32 i2cBlock = 2;
    optional int32 sdaPin = 3;
    optional int32 sclPin = 4;
    optional uint32 i2cAddress = 5;   // default 0x3C
    // Panel size (GPGFX_DisplaySize: 128x32 = 2, 128x64 = 3).
    optional uint32 size = 6;
    // Rotation 0-3 and color invert, baked into the init command sequence.
    optional uint32 flip = 7;
    optional bool invert = 8;
    // Full-panel button layout. Board-fixed: ships with the board config and
    // is re-applied at load, not editable via the web config.
    optional ButtonLayout buttonLayout = 9;
    optional ButtonLayoutOrientation orientation = 10;
    // Custom layout params (used when buttonLayout = BUTTON_LAYOUT_CUSTOM):
    // where the first button starts and how buttons tile from there.
    optional uint32 startX = 11;
    optional uint32 startY = 12;
    optional uint32 buttonRadius = 13;
    optional uint32 buttonPadding = 14;
    // Splash mode is board-fixed (ships with the board config); the duration is
    // a user setting in seconds.
    optional SplashMode splashMode = 15;
    optional uint32 splashDuration = 16;   // seconds (0 = stay on splash)
    // Display saver: timeout in seconds (0 = never) and scene.
    optional uint32 displaySaverTimeout = 17;   // seconds (0 = never)
    optional DisplaySaverMode displaySaverMode = 18;
    // Bottom-of-screen input history.
    optional bool inputHistoryEnabled = 19;
    optional uint32 inputHistoryTimeout = 20;   // seconds
    // Mini-menu navigation key indices. Board-defined defaults (the dpad keys
    // + B1/B2); -1 = resolve from the active profile's key mapping instead.
    optional int32 menuUpPin = 22;
    optional int32 menuDownPin = 23;
    optional int32 menuLeftPin = 24;
    optional int32 menuRightPin = 25;
    optional int32 menuSelectPin = 26;
    optional int32 menuBackPin = 27;
}
