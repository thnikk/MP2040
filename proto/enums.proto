syntax = "proto2";

import "nanopb.proto";

enum InputMode
{
    option (nanopb_enumopt).long_names = false;

    INPUT_MODE_CONFIG = 0;
    INPUT_MODE_KEYBOARD = 1;
    INPUT_MODE_MIDI = 2;
    // Gamepad modes. XInput presents as an Xbox 360 controller (PC); Switch
    // Pro emulates a Pro Controller (Nintendo hardware). Pins mapped to
    // GAMEPAD_* keycodes become the corresponding buttons / dpad directions.
    INPUT_MODE_XINPUT = 3;
    INPUT_MODE_SWITCH_PRO = 4;
}

// SOCD cleaning mode for the gamepad dpad. Applied whenever two opposite
// directions are held at once. Values match GP2040-CE so the cleaner ports
// directly. SOCD_MODE_UP_PRIORITY (0) is the default: U+D=U, L+R=neutral.
enum SOCDMode
{
    option (nanopb_enumopt).long_names = false;

    SOCD_MODE_UP_PRIORITY = 0;              // U+D=U, L+R=N
    SOCD_MODE_NEUTRAL = 1;                  // U+D=N, L+R=N
    SOCD_MODE_SECOND_INPUT_PRIORITY = 2;    // U>D=D, L>R=R (Last Input Priority)
    SOCD_MODE_FIRST_INPUT_PRIORITY = 3;     // U>D=U, L>R=L (First Input Priority)
    SOCD_MODE_BYPASS = 4;                   // U+D=UD, L+R=LR (no cleaning)
}

enum LEDFormat_Proto
{
    option (nanopb_enumopt).long_names = false;

    LED_FORMAT_RGB = 0;
    LED_FORMAT_GRB = 1;
    LED_FORMAT_GRBW = 2;
    LED_FORMAT_RGBW = 3;
}
