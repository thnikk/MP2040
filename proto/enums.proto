syntax = "proto2";

import "nanopb.proto";

enum InputMode
{
    option (nanopb_enumopt).long_names = false;

    INPUT_MODE_CONFIG = 0;
    INPUT_MODE_KEYBOARD = 1;
    INPUT_MODE_MIDI = 2;
    // Gamepad modes. XInput presents as an Xbox 360 controller (PC); Switch
    // Pro emulates a Pro Controller (Nintendo hardware). Pins mapped to
    // GAMEPAD_* keycodes become the corresponding buttons / dpad directions.
    INPUT_MODE_XINPUT = 3;
    INPUT_MODE_SWITCH_PRO = 4;
}

// SOCD cleaning mode for the gamepad dpad. Applied whenever two opposite
// directions are held at once. Values match GP2040-CE so the cleaner ports
// directly. SOCD_MODE_UP_PRIORITY (0) is the default: U+D=U, L+R=neutral.
enum SOCDMode
{
    option (nanopb_enumopt).long_names = false;

    SOCD_MODE_UP_PRIORITY = 0;              // U+D=U, L+R=N
    SOCD_MODE_NEUTRAL = 1;                  // U+D=N, L+R=N
    SOCD_MODE_SECOND_INPUT_PRIORITY = 2;    // U>D=D, L>R=R (Last Input Priority)
    SOCD_MODE_FIRST_INPUT_PRIORITY = 3;     // U>D=U, L>R=L (First Input Priority)
    SOCD_MODE_BYPASS = 4;                   // U+D=UD, L+R=LR (no cleaning)
}

enum LEDFormat_Proto
{
    option (nanopb_enumopt).long_names = false;

    LED_FORMAT_RGB = 0;
    LED_FORMAT_GRB = 1;
    LED_FORMAT_GRBW = 2;
    LED_FORMAT_RGBW = 3;
}

// Full-panel display layout. Unlike GP2040-CE there is no left/right split:
// a layout is one ordered list of elements spanning the whole panel.
enum ButtonLayout
{
    option (nanopb_enumopt).long_names = false;

    BUTTON_LAYOUT_STICK = 0;        // dpad (left) + arcade buttons (right)
    BUTTON_LAYOUT_STICKLESS = 1;    // WASD box (left) + arcade buttons (right)
    BUTTON_LAYOUT_VLX = 2;          // Vewlix arcade layout
    BUTTON_LAYOUT_FIGHTBOARD = 3;   // stickless / fightboard all-button layout
    BUTTON_LAYOUT_CUSTOM = 4;       // generated from buttonLayoutCustomParams
    BUTTON_LAYOUT_BOARD_DEFINED = 5; // from the board's BOARD_DISPLAY_LAYOUT
}

enum SplashMode
{
    option (nanopb_enumopt).long_names = false;

    SPLASH_MODE_STATIC = 0;
    SPLASH_MODE_CLOSEIN = 1;
    SPLASH_MODE_NONE = 2;
}

enum DisplaySaverMode
{
    option (nanopb_enumopt).long_names = false;

    DISPLAY_SAVER_DISPLAY_OFF = 0;
    DISPLAY_SAVER_SNOW = 1;
    DISPLAY_SAVER_BOUNCE = 2;
    DISPLAY_SAVER_PIPES = 3;
    DISPLAY_SAVER_TOAST = 4;
    DISPLAY_SAVER_STARS = 5;
}

enum ButtonLayoutOrientation
{
    option (nanopb_enumopt).long_names = false;

    BUTTON_ORIENTATION_DEFAULT = 0;
    BUTTON_ORIENTATION_SOUTHPAW = 1;
    BUTTON_ORIENTATION_SWITCHED = 2;
}

// Layout element kinds (mirrors GP2040-CE's GPElement). PIN_BUTTON is a key
// index in key state; BTN_BUTTON / DIR_BUTTON are gamepad controls resolved
// through GamepadMapping.
enum GPElement
{
    option (nanopb_enumopt).long_names = false;

    GP_ELEMENT_WIDGET = 0;
    GP_ELEMENT_SCREEN = 1;
    GP_ELEMENT_BTN_BUTTON = 2;
    GP_ELEMENT_DIR_BUTTON = 3;
    GP_ELEMENT_PIN_BUTTON = 4;
    GP_ELEMENT_LEVER = 5;
    GP_ELEMENT_LABEL = 6;
    GP_ELEMENT_SPRITE = 7;
    GP_ELEMENT_SHAPE = 8;
}

enum GPShape_Type
{
    option (nanopb_enumopt).long_names = false;

    GP_SHAPE_ELLIPSE = 0;
    GP_SHAPE_SQUARE = 1;
    GP_SHAPE_LINE = 2;
    GP_SHAPE_POLYGON = 3;
    GP_SHAPE_ARC = 4;
}

// Action triggered by a configurable hotkey. A hotkey is a set of key indices
// held simultaneously; when the combo fires, the hotkey controller dispatches
// the action below. New actions are appended (never renumbered) so stored
// configs stay valid across firmware updates.
enum HotkeyAction
{
    option (nanopb_enumopt).long_names = false;

    HOTKEY_NONE = 0;
    // Set the gamepad SOCD cleaning mode (matches SOCDMode values). Persists
    // like the web-config setting.
    HOTKEY_SOCD_UP_PRIORITY = 1;
    HOTKEY_SOCD_NEUTRAL = 2;
    HOTKEY_SOCD_LAST_INPUT = 3;
    HOTKEY_SOCD_FIRST_INPUT = 4;
    HOTKEY_SOCD_BYPASS = 5;
    // Load a profile (1-based; profiles are indexed 0-3 in config). Switches
    // live and persists.
    HOTKEY_LOAD_PROFILE_1 = 6;
    HOTKEY_LOAD_PROFILE_2 = 7;
    HOTKEY_LOAD_PROFILE_3 = 8;
    HOTKEY_LOAD_PROFILE_4 = 9;
    HOTKEY_NEXT_PROFILE = 10;
    HOTKEY_PREVIOUS_PROFILE = 11;
    // Play a macro (M1-M8) while the hotkey is held, looping like a per-pin
    // macro trigger. The macro runs even if its trigger keys are elsewhere.
    HOTKEY_TRIGGER_MACRO_1 = 12;
    HOTKEY_TRIGGER_MACRO_2 = 13;
    HOTKEY_TRIGGER_MACRO_3 = 14;
    HOTKEY_TRIGGER_MACRO_4 = 15;
    HOTKEY_TRIGGER_MACRO_5 = 16;
    HOTKEY_TRIGGER_MACRO_6 = 17;
    HOTKEY_TRIGGER_MACRO_7 = 18;
    HOTKEY_TRIGGER_MACRO_8 = 19;
    // Toggle the on-device mini menu (boards with a display). Fires on the
    // press edge; the hotkey controller requests the toggle and the display
    // controller flips between the layout and the menu.
    HOTKEY_TOGGLE_MENU = 20;
}
