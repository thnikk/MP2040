<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="darkreader-lock">
  <title>MP2040 Config</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      var saved = localStorage.getItem('theme') || 'auto';
      var t = saved === 'auto'
        ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : saved;
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="navigation">
    <div class="nav-inner">
      <a class="logo-link" href="#" title="MP2040">
        <img class="nav-logo" src="/icons/logo.svg" alt="MP2040">
      </a>
      <div class="nav-title">
        <h1>MP2040 <span id="board-label"></span></h1>
      </div>
    </div>
  </header>

  <main>
    <section>
      <h2>LEDs</h2>
      <div class="led-form">
        <label class="led-mode-label">LED Mode
          <select id="led-mode">
            <option value="0">Static</option>
            <option value="1">Cycle</option>
            <option value="2">Reactive</option>
            <option value="3">BPS</option>
          </select>
        </label>
        <div class="led-slider" id="led-brightness"></div>
        <div class="led-slider" id="led-speed"></div>
        <div class="led-colors">
          <div class="led-color-picker"><div id="led-colorNormal"></div></div>
          <div class="led-color-picker"><div id="led-colorPressed"></div></div>
        </div>
      </div>
    </section>

    <section>
      <h2>Board</h2>
      <p class="hint">Click a button on the board to set its key and modifiers.</p>
      <div id="board-panel"></div>
    </section>

    <div class="actions">
      <button id="save">Save &amp; Reboot</button>
      <button id="reset" class="danger">Reset Settings</button>
      <span id="status"></span>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>MP2040</span>
      <div class="theme-toggle">
        <button class="theme-btn" data-theme="light" title="Light"><img src="/icons/light.svg" alt="Light theme"></button>
        <button class="theme-btn" data-theme="dark" title="Dark"><img src="/icons/dark.svg" alt="Dark theme"></button>
        <button class="theme-btn" data-theme="auto" title="Auto"><img src="/icons/auto.svg" alt="Auto theme"></button>
      </div>
      <span></span>
    </div>
  </footer>

  <div id="key-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h3 id="key-modal-title">GP00</h3>
      <p class="hint">Pick one key and any number of modifiers from the Modifiers group.</p>
      <div id="key-modal-select"></div>
      <div class="modal-actions">
        <button id="key-modal-cancel" class="secondary" type="button">Cancel</button>
        <button id="key-modal-save" type="button">Save</button>
      </div>
    </div>
  </div>

  <script src="/multiselect.js"></script>
  <script src="/boardview.js"></script>
  <script src="/pillslider.js"></script>
  <script src="/app.js"></script>
</body>
</html>
